# Noctalia v5 plugin manifest (current schema). EXPERIMENTAL: the Luau port has
# not been published. The JSON v4 manifest stays authoritative for v4.
id = "alpzy/deepseek-peak"
name = "DeepSeek Peak Hours"
version = "1.1.0"
plugin_api = 22
author = "Alpzy"
license = "MIT"
icon = "zap"
description = "DeepSeek peak/off-peak bar widget for Noctalia. Green off-peak, red peak."
tags = ["bar", "panel", "indicator"]

[[setting]]
key = "displayMode"
type = "select"
label_key = "settings.displayMode.label"
description_key = "settings.displayMode.description"
default = "compact"

  [[setting.options]]
  value = "compact"
  label_key = "settings.displayMode.compact"

  [[setting.options]]
  value = "icon"
  label_key = "settings.displayMode.icon"

  [[setting.options]]
  value = "full"
  label_key = "settings.displayMode.full"

[[setting]]
key = "provider"
type = "select"
label_key = "settings.provider.label"
description_key = "settings.provider.description"
default = "deepseek"

  [[setting.options]]
  value = "deepseek"
  label_key = "provider.deepseek"

  [[setting.options]]
  value = "ollama"
  label_key = "provider.ollama"

[[setting]]
key = "offPeakColor"
type = "color"
label_key = "settings.offPeakColor.label"
description_key = "settings.offPeakColor.description"
default = "#4ade80"

[[setting]]
key = "peakColor"
type = "color"
label_key = "settings.peakColor.label"
description_key = "settings.peakColor.description"
default = "#f87171"

[[setting]]
key = "driftColor"
type = "color"
label_key = "settings.driftColor.label"
description_key = "settings.driftColor.description"
default = "#fbbf24"

[[setting]]
key = "showTooltip"
type = "bool"
label_key = "settings.showTooltip.label"
description_key = "settings.showTooltip.description"
default = true

[[setting]]
key = "autoCheck"
type = "bool"
label_key = "settings.autoCheck.label"
description_key = "settings.autoCheck.description"
default = true

[[setting]]
key = "offlineOnly"
type = "bool"
label_key = "settings.offlineOnly.label"
description_key = "settings.offlineOnly.description"
default = false

[[setting]]
key = "checkIntervalH"
type = "int"
label_key = "settings.checkIntervalH.label"
description_key = "settings.checkIntervalH.description"
default = 6
min = 1
max = 168

[[setting]]
key = "customSourceUrl"
type = "string"
label_key = "settings.customSourceUrl.label"
description_key = "settings.customSourceUrl.description"
default = ""

[[widget]]
id = "peak"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 340
height = 420
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "checker"
entry = "checker.luau"
