name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Generated code is in sync
        run: |
          python tools/sync_peak.py --check
          python tools/sync_i18n.py --check
      - name: Python + node test suite
        run: python -m pytest tests/ -q
